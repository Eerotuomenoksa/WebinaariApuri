        const toLocalDateValue = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const toTimeValue = (date) =>
            `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;

        const getNextHour = () => {
            const nextHour = new Date();
            nextHour.setHours(nextHour.getHours() + 1, 0, 0, 0);
            return { date: toLocalDateValue(nextHour), time: toTimeValue(nextHour) };
        };

        const getFutureTime = (minutes) => {
            const future = new Date(Date.now() + minutes * 60 * 1000);
            future.setSeconds(0, 0);
            return { date: toLocalDateValue(future), time: toTimeValue(future) };
        };

        const toTimestamp = (date, time) => {
            const timestamp = new Date(`${date}T${time}:00`).getTime();
            return Number.isNaN(timestamp) ? null : timestamp;
        };

        const MusicType = {
            NONE: 'NONE',
            CUSTOM: 'CUSTOM'
        };

        class AudioService {
            constructor() {
                this.currentSource = MusicType.NONE;
                this.volume = 0.25;
                this.isMuted = false;
                this.audioEl = null;
            }

            setMuted(muted) {
                this.isMuted = muted;
                const target = this.isMuted ? 0 : this.volume;
                if (this.audioEl) this.audioEl.volume = target;
            }

            play(type, customUrl) {
                const rawSource = type === MusicType.CUSTOM ? customUrl : type;
                if (!rawSource || rawSource === 'NONE') {
                    this.stop();
                    return;
                }

                const source = encodeURI(rawSource);
                
                if (this.currentSource === source) return;
                this.stop();
                this.currentSource = source;

                this.audioEl = new Audio(source);
                this.audioEl.loop = true;
                this.audioEl.volume = this.isMuted ? 0 : this.volume;
                this.audioEl.play().catch(e => {
                    console.warn(`Audio tiedostoa ei voitu toistaa: ${source}`, e);
                    this.stop();
                });
            }

            stop() {
                if (this.audioEl) {
                    this.audioEl.pause();
                    this.audioEl = null;
                }
                this.currentSource = MusicType.NONE;
            }
        }

        const App = () => {

                const initialBreakReturn = getFutureTime(15);
                return {
                    language: 'fi',
                    eventTitle: 'Verkkolähetyksen Otsikko',
                    startDate: initialStart.date,
                    startTime: initialStart.time,
                    backgroundColor: '#f1f5f9',
                    titlePosition: 'inside',
                    showSeconds: true,
                    extraInfo: 'Tervetuloa mukaan!\nAloitamme hetken kuluttua.',
                    musicType: MusicType.NONE,
                    customMusicUrl: null,
                    logoUrl: null,
                    imageUrl: 'https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&q=80&w=1200',
                    showLogo: true,
                    showImage: true,
                    isBreakMode: false,
                    breakText: '',
                    breakReturnDate: initialBreakReturn.date,
                    breakReturnTime: initialBreakReturn.time,
                    showCameraWarning: true,
                    showMicWarning: true,
                    showRecordingWarning: true,
                };
            });

            const t = translations[settings.language];
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [breakTimeLeft, setBreakTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isMuted, setIsMuted] = useState(false);

            useEffect(() => {
                const updateCountdowns = () => {
                    const eventTarget = toTimestamp(settings.startDate, settings.startTime);
                    const diff = eventTarget === null ? 0 : Math.max(0, eventTarget - Date.now());
                    setTimeLeft({
                        days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                        minutes: Math.floor((diff / 1000 / 60) % 60),
                        seconds: Math.floor((diff / 1000) % 60)
                    });

                    if (settings.isBreakMode) {
                        const breakTarget = toTimestamp(settings.breakReturnDate, settings.breakReturnTime);
                        const bDiff = breakTarget === null ? 0 : Math.max(0, breakTarget - Date.now());
                        setBreakTimeLeft({
                            days: Math.floor(bDiff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((bDiff / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((bDiff / 1000 / 60) % 60),
                            seconds: Math.floor((bDiff / 1000) % 60)
                        });
                    }
                };
                updateCountdowns();
                const timer = setInterval(updateCountdowns, 1000);
                return () => clearInterval(timer);
            }, [
                settings.startDate,
                settings.startTime,
                settings.breakReturnDate,
                settings.breakReturnTime,
                settings.isBreakMode
            ]);

            useEffect(() => {
                audioService.play(settings.musicType, settings.customMusicUrl);
            }, [settings.musicType, settings.customMusicUrl]);

            useEffect(() => { audioService.setMuted(isMuted); }, [isMuted]);

            useEffect(() => {
                const handleKeyPress = (e) => {
                    const target = e.target;
                    const isInteractive = target instanceof HTMLElement && (
                        target.isContentEditable ||
                        ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(target.tagName)
                    );
                    if (e.code === 'Space' && !isInteractive) {
                        e.preventDefault();
                        setIsMuted(prev => !prev);
                    }
                };
                window.addEventListener('keydown', handleKeyPress);
                return () => window.removeEventListener('keydown', handleKeyPress);
            }, []);

            return html`
                <div className="h-screen w-screen flex flex-col relative transition-colors duration-700" style=${{ backgroundColor: settings.backgroundColor }}>
                    
                    <div className="absolute top-8 left-8 z-20">
                        ${settings.showLogo && (settings.logoUrl ? html`<img src=${settings.logoUrl} className="h-20 md:h-28 object-contain" />` : html`<div className="h-20 w-20 md:h-28 md:w-28 bg-white/50 rounded-2xl flex items-center justify-center text-slate-400 text-[10px] font-bold uppercase border border-dashed">Logo</div>`)}
                    </div>

                    <main className="flex-1 flex flex-col items-center justify-center px-8 lg:px-20 py-10">
                        <div className="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                            
                            <div className="lg:col-span-7 flex flex-col items-center lg:items-start space-y-6">
                                ${(settings.titlePosition === 'above' || (!settings.showImage && settings.titlePosition === 'inside')) && html`
                                    <h1 className="text-3xl md:text-5xl font-bold text-slate-800 w-full text-center lg:text-left">${settings.eventTitle}</h1>
                                `}
                                ${settings.showImage && html`
                                <div className="w-full aspect-video bg-white rounded-[2.5rem] overflow-hidden shadow-2xl relative border-8 border-white/50">
                                    <img src=${settings.imageUrl} className="w-full h-full object-cover" />
                                    ${settings.titlePosition === 'inside' && html`
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex items-end pb-12 px-10">
                                            <h1 className="text-3xl md:text-5xl font-bold text-white drop-shadow-2xl">${settings.eventTitle}</h1>
                                        </div>
                                    `}
                                    ${settings.isBreakMode && html`
                                        <div className="absolute inset-0 bg-purple-900/60 backdrop-blur-md flex items-center justify-center z-20">
                                            <div className="bg-white px-10 py-6 rounded-3xl shadow-2xl border-b-8 border-purple-700 transform -rotate-3">
                                                <span className="text-3xl md:text-5xl font-black text-purple-700 uppercase tracking-tighter italic">${t.breakTitle}</span>
                                            </div>
                                        </div>
                                    `}
                                </div>
                                `}
                                ${settings.titlePosition === 'below' && html`
                                    <h1 className="text-3xl md:text-5xl font-bold text-slate-800 w-full text-center lg:text-left">${settings.eventTitle}</h1>
                                `}
                            </div>

                            <div className="lg:col-span-5 flex flex-col space-y-6">
                                <div className="bg-white/40 backdrop-blur-2xl rounded-[3rem] p-10 border border-white/60 shadow-2xl space-y-6">
                                    <p className="text-xs text-slate-500 font-bold uppercase tracking-[0.2em]">${settings.isBreakMode ? t.returnsIn : t.startsIn}</p>

                                    ${settings.isBreakMode ? html`
                                        <div className="space-y-6">
                                            <div className="flex gap-4">
                                                ${[
                                                    {v: breakTimeLeft.days, l: t.days, s: breakTimeLeft.days > 0},
                                                    {v: breakTimeLeft.hours, l: t.hours, s: breakTimeLeft.hours > 0},
                                                    {v: breakTimeLeft.minutes, l: t.minutes, s: true},
                                                    {v: breakTimeLeft.seconds, l: t.seconds, s: settings.showSeconds}
                                                ].filter(u => u.s).map(u => html`
                                                    <div key=${u.l} className="flex flex-col items-center bg-purple-600 rounded-3xl p-4 min-w-[80px] shadow-lg border border-purple-400">
                                                        <span className="text-3xl md:text-5xl font-black text-white tabular-nums">${String(u.v).padStart(2, '0')}</span>
                                                        <span className="text-[10px] text-purple-200 font-black uppercase mt-1 tracking-widest">${u.l}</span>
                                                    </div>
                                                `)}
                                            </div>
                                            <div className="pt-2">
                                                <p className="text-xl md:text-2xl font-bold text-slate-800 uppercase tracking-wide opacity-90">${t.returningAt} ${settings.breakReturnTime}</p>
                                                ${settings.breakText && html`<p className="text-lg font-bold text-purple-700 leading-tight whitespace-pre-wrap mt-2">${settings.breakText}</p>`}
                                            </div>
                                        </div>
                                    ` : html`
                                        <div className="flex gap-4">
                                            ${[
                                                {v: timeLeft.days, l: t.days, s: timeLeft.days > 0},
                                                {v: timeLeft.hours, l: t.hours, s: timeLeft.hours > 0 || timeLeft.days > 0},
                                                {v: timeLeft.minutes, l: t.minutes, s: true},
                                                {v: timeLeft.seconds, l: t.seconds, s: settings.showSeconds}
                                            ].filter(u => u.s).map(u => html`
                                                <div key=${u.l} className="flex flex-col items-center bg-white/80 rounded-3xl p-4 min-w-[80px] border border-white">
                                                    <span className="text-3xl md:text-5xl font-black text-slate-900 tabular-nums">${String(u.v).padStart(2, '0')}</span>
                                                    <span className="text-[10px] text-slate-400 font-black uppercase mt-1 tracking-widest">${u.l}</span>
                                                </div>
                                            `)}
                                        </div>
                                    `}
                                </div>
                                
                                ${settings.extraInfo && !settings.isBreakMode && html`
                                    <div className="bg-white/20 p-8 rounded-3xl border border-white/30 backdrop-blur-sm shadow-sm">
                                        <div className="text-slate-700 text-lg md:text-xl font-medium leading-relaxed whitespace-pre-wrap italic">
                                            ${settings.extraInfo}
                                        </div>
                                    </div>
                                `}

                                <div className="flex flex-col gap-3">
                                    ${settings.showRecordingWarning && html`
                                        <div className="bg-blue-50/90 backdrop-blur-sm text-blue-700 px-5 py-4 rounded-2xl flex items-center gap-4 text-xs md:text-sm font-bold shadow-sm border border-blue-200 animate-in slide-in-from-right duration-300">
                                            <div className="flex items-center justify-center w-8 h-8 text-xl">
                                                🔴
                                            </div>
                                            <span>${t.recWarn}</span>
                                        </div>
                                    `}
                                    ${settings.showCameraWarning && html`
                                        <div className="bg-red-50/80 backdrop-blur-sm text-red-700 px-5 py-4 rounded-2xl flex items-center gap-4 text-xs md:text-sm font-bold shadow-sm border border-red-200 animate-in slide-in-from-right duration-500">
                                            <div className="relative inline-flex items-center justify-center w-8 h-8">
                                                <span className="text-xl">📷</span>
                                                <div className="strike-line"></div>
                                            </div>
                                            <span>${t.camWarn}</span>
                                        </div>
                                    `}
                                    ${settings.showMicWarning && html`
                                        <div className="bg-slate-800/90 backdrop-blur-sm text-white px-5 py-4 rounded-2xl flex items-center gap-4 text-xs md:text-sm font-bold shadow-sm border border-slate-700 animate-in slide-in-from-right duration-700">
                                            <div className="relative inline-flex items-center justify-center w-8 h-8">
                                                <span className="text-xl">🎤</span>
                                                <div className="strike-line"></div>
                                            </div>
                                            <span>${t.micWarn}</span>
                                        </div>
                                    `}
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="h-24 bg-white/20 backdrop-blur-xl flex flex-col items-center justify-center relative border-t border-white/40 px-4">
                        <div className="text-center">
                            <p className="text-slate-600 text-sm font-semibold tracking-wide">${t.footerTop}</p>
                            <p className="text-slate-500 text-[11px] font-medium italic">${t.footerBottom}</p>
                        </div>
                        <div className="absolute right-12 flex gap-4">
                            <button onClick=${() => setIsMuted(!isMuted)} className="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-lg border border-slate-100 hover:scale-110 transition-transform focus:outline-none" title="Mute/Unmute">
                                ${isMuted ? '🔇' : (settings.musicType === MusicType.CUSTOM && settings.customMusicUrl ? html`
                                    <div className="music-playing-bars text-blue-600">
                                        <div className="music-bar"></div>
                                        <div className="music-bar" style=${{animationDelay: '0.2s'}}></div>
                                        <div className="music-bar" style=${{animationDelay: '0.4s'}}></div>
                                    </div>
                                ` : '🔊')}
                            </button>
                            <button onClick=${() => setIsSettingsOpen(true)} className="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-lg border border-slate-100 hover:scale-110 transition-transform focus:outline-none" title="Settings">
                                ⚙️
                            </button>
                        </div>
                    </footer>

                    ${isSettingsOpen && html`<${SettingsModal} settings=${settings} setSettings=${setSettings} onClose=${() => setIsSettingsOpen(false)} />`}
                </div>
            `;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
</body>
</html>
